plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.plixo2'
version = '3.4.0-SNAPSHOT-1'

project.ext.lwjglVersion = "3.4.1"
project.ext.lwjglNatives = "natives-windows"
project.ext.jomlVersion = "1.10.8"

repositories {
    mavenCentral()
}

dependencies {
    //annotations
    compileOnly 'org.jetbrains:annotations:23.0.0'

    //lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'


    compileOnly  'com.google.errorprone:error_prone_annotations:2.45.0'

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-stb::$lwjglNatives"
    implementation "org.joml:joml:${jomlVersion}"

    api files("libs/windows/SDL-3.4.jar")

    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.0'

}

subprojects {

    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    dependencies {
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
        testCompileOnly 'org.projectlombok:lombok:1.18.42'
        testImplementation platform('org.junit:junit-bom:6.0.0')
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.0'
    }

}

jar {
    from {
        configurations.runtimeClasspath
                .filter { it.name == "SDL-3.4.jar" }
                .collect { zipTree(it) }
    }
}
java {
    withSourcesJar()
}

tasks.named('sourcesJar', Jar) {
    from {
        zipTree(file("libs/windows/SDL-3.4-sources.jar"))
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
}
tasks.withType(Test).configureEach {
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
}

javadoc {
    options.tags = [
            "sdlAPI:a:SDL API:",
            "sdlOther:a:Other SDL Symbols:",
            "sdlCategory:a:SDL Category:",
            "threadSafety:a:Thread Safety:",
    ]
}

tasks.javadoc {
    options {
        memberLevel = JavadocMemberLevel.PRIVATE
    }
    doLast {
        def outputDir = javadoc.destinationDir

        // Map symbol -> relative html path
        def sdlEntries = [:]

        sourceSets.main.java.srcDirs.each { srcDir ->
            srcDir.eachFileRecurse { file ->
                if (file.name.endsWith(".java")) {
                    def text = file.text

                    // Derive the HTML path from the package + class name
                    def packageMatch = text =~ /package\s+([\w.]+)\s*;/
                    def packageName = packageMatch ? packageMatch[0][1] : ""
                    def className = file.name.replace(".java", "")
                    def htmlPath = (packageName ? packageName.replace(".", "/") + "/" : "") + "${className}.html"

                    text.findAll(/@sdlAPI\s+(\S+)/) { match, symbol ->
                        sdlEntries[symbol] = htmlPath
                    }
                }
            }
        }

        def newEntries = sdlEntries.collect { symbol, htmlPath ->
            """{"l":"${symbol}","h":"${htmlPath}","k":"18","u":"${htmlPath}"}"""
        }

        def indexFile = new File(outputDir, "tag-search-index.js")
        def existing = indexFile.text
        def json = existing
                .replaceFirst(/^tagSearchIndex\s*=\s*/, "")
                .replaceAll(/;?\s*$/, "")
                .trim()

        def merged = json.replaceFirst(/^\[/, "[" + newEntries.join(",") + (json == "[]" ? "" : ","))
        indexFile.text = "tagSearchIndex = ${merged};"

        println "Injected ${sdlEntries.size()} SDL entries into tag-search-index.js"
    }
}
