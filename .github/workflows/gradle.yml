name: Gradle CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle Permissions
        run: chmod +x ./gradlew
      - name: Install dependencies
        run: |
          sudo apt-get install build-essential git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
      - name: Install SDL3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git build-essential
      - name: Build SDL3
        run: |
          git clone https://github.com/libsdl-org/SDL.git
          cd SDL
          cmake -S . -B build -G Ninja -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build
          sudo ldconfig

      - name: test with Gradle
        run: ./gradlew clean test --no-build-cache --stacktrace --info