name: Gradle CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle Permissions
        run: chmod +x ./gradlew
      - name: Install SDL3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git build-essential
      - name: Build SDL3
        run: |
          git clone https://github.com/libsdl-org/SDL.git
          cd SDL
          cmake -S . -B build -G Ninja -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build
          sudo ldconfig

      - name: test with Gradle
        run: ./gradlew clean test --no-build-cache